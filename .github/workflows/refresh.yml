# Refreshes the catalog, the department tentative plans and the Class Planner
# terms every Monday, then opens (or updates) one pull request with the diff.
#
# A pull request opened with the default GITHUB_TOKEN does not trigger
# tests.yml, so this job runs the offline tests itself and puts their summary
# lines in the PR body. A failing test does not stop the PR from being opened:
# the owner should see the failure there.
#
# One-time repository setting (owner only): Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests".
name: data-refresh

on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: data-refresh

jobs:
  refresh:
    if: github.repository == 'zhenzhenfufu/ucsd-course-planning-tutor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the devcontainer
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Keeps ETags between weekly runs so unchanged pages answer 304.
      - uses: actions/cache@v4
        with:
          path: .refresh_cache
          key: refresh-cache-${{ github.run_id }}
          restore-keys: refresh-cache-

      # With no --only, refresh.run refreshes every source.
      # It exits 1 only when every selected source failed; that failure is
      # raised in the last step, after the report is uploaded.
      # The report lives outside the checkout so nothing run afterwards in the
      # repo root (the unit tests call refresh.run too) can overwrite it.
      - name: Refresh data
        id: refresh
        continue-on-error: true
        run: python -m refresh.run --report "$RUNNER_TEMP/refresh_report.md"

      - name: Unit tests
        id: pytest
        continue-on-error: true
        run: set -o pipefail; pytest tests/ -q 2>&1 | tee pytest.log

      - name: Validator self-test
        id: selftest
        continue-on-error: true
        run: set -o pipefail; python eval/run_eval.py --offline 2>&1 | tee selftest.log

      - name: Add test results to the report
        if: always()
        run: |
          REPORT="$RUNNER_TEMP/refresh_report.md"
          touch "$REPORT"
          # Drop the report's placeholder Tests section, then write the real one.
          python - <<'PY'
          import os
          p = os.path.join(os.environ["RUNNER_TEMP"], "refresh_report.md")
          text = open(p, encoding="utf-8").read()
          i = text.find("\n## Tests")
          open(p, "w", encoding="utf-8").write((text[:i] if i != -1 else text).rstrip() + "\n")
          PY
          {
            echo
            echo "## Tests"
            echo
            echo "- pytest (${{ steps.pytest.outcome }}): $(tail -n 1 pytest.log 2>/dev/null || echo 'did not run')"
            echo "- validator self-test (${{ steps.selftest.outcome }}): $(grep 'fixtures correct' selftest.log 2>/dev/null || echo 'did not run')"
          } >> "$REPORT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-report
          path: ${{ runner.temp }}/refresh_report.md

      - name: Commit and open or update the pull request
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C data-refresh
          git add data/
          git commit -m "Data refresh $(date -u +%F)"
          git push --force origin data-refresh
          if [ -n "$(gh pr list --head data-refresh --state open --json number --jq '.[].number')" ]; then
            gh pr edit data-refresh --body-file "$RUNNER_TEMP/refresh_report.md"
          else
            gh pr create --base main --head data-refresh \
              --title "Data refresh $(date -u +%F)" --body-file "$RUNNER_TEMP/refresh_report.md"
          fi

      - name: Fail the job if every source failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "refresh.run exited non-zero: every selected source failed."
          exit 1
